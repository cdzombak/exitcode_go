---
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  meta:
    name: Derive Release Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Derive version string
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Determine whether this is a prerelease
        id: prerelease
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$VERSION" =~ -(alpha|beta|rc)\. ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.prerelease.outputs.is_prerelease }}

  # A Go module's version comes entirely from the git tag; there is no version
  # string in the repo. The one thing that can drift is the major-version
  # suffix on the module path, which is required from v2 onward.
  module-path:
    name: Verify Module Path
    needs: [meta]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check major version suffix
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          major="${VERSION%%.*}"
          module="$(go list -m)"
          echo "tag major version: v${major}"
          echo "module path: ${module}"
          if [ "$major" -ge 2 ]; then
            if [ "${module##*/}" != "v${major}" ]; then
              echo "::error::module path ${module} must end in /v${major} to release v${VERSION}"
              exit 1
            fi
          elif [[ "${module##*/}" =~ ^v[0-9]+$ ]]; then
            echo "::error::module path ${module} carries a major version suffix but the tag is v${VERSION}"
            exit 1
          fi

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  release:
    name: GitHub Release
    needs: [meta, module-path, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
          draft: false
          generate_release_notes: true

  proxy:
    name: Warm Go Module Proxy
    needs: [meta, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      # Asking the proxy for the new version makes it fetch and cache the tag,
      # so `go get` works immediately rather than on the proxy's own schedule.
      - name: Request new version from proxy
        continue-on-error: true
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          GOPROXY: proxy.golang.org
        run: |
          module="$(go list -m)"
          go list -m "${module}@v${VERSION}"

  ntfy:
    name: Ntfy
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs: [meta, module-path, lint, release, proxy]
    steps:
      - name: Send success notification
        uses: niniyas/ntfy-action@master
        if: ${{ !contains(needs.*.result, 'failure') }}
        with:
          url: "https://ntfy.cdzombak.net"
          topic: "gha-builds"
          priority: 3
          headers: '{"authorization": "Bearer ${{ secrets.NTFY_TOKEN }}"}'
          tags: white_check_mark
          title: ${{ github.event.repository.name }} ${{ needs.meta.outputs.version }} available
          details: ${{ github.event.repository.name }} version ${{ needs.meta.outputs.version }} is now available.
      - name: Send failure notification
        uses: niniyas/ntfy-action@master
        if: ${{ contains(needs.*.result, 'failure') }}
        with:
          url: "https://ntfy.cdzombak.net"
          topic: "gha-builds"
          priority: 3
          headers: '{"authorization": "Bearer ${{ secrets.NTFY_TOKEN }}"}'
          tags: no_entry
          title: ${{ github.event.repository.name }} ${{ needs.meta.outputs.version }} release failed
          details: Release failed for ${{ github.event.repository.name }} version ${{ needs.meta.outputs.version }}.
